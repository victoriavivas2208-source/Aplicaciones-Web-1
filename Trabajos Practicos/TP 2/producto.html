<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Garage - Producto</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="header-top">
            <div class="logo">RACING GARAGE</div>
            <div class="cart">🛒</div>
        </div>

        <nav>
            <a href="index.html">INICIO</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">CONTACTOS</a>
        </nav>
    </header>

    <main>

        <section class="detail-layout">

            <div>
                <div class="detail-image">
                    <img src="./imagenes/escape.jpg" alt="Imagen de Escape de Titanio Alto Flujo" width="548"
                        height="330">
                </div>

                <div class="thumbnails">
                    <img src="./imagenes/escape1.jpg" alt="Imagen de Escape de Titanio Alto Flujo" width="130"
                        height="80">
                    <img src="./imagenes/escape2.jpg" alt="Imagen de Escape de Titanio Alto Flujo" width="130"
                        height="80">
                    <img src="./imagenes/escape3.jpg" alt="Imagen de Escape de Titanio Alto Flujo" width="130"
                        height="80">
                    <img src="./imagenes/escape4.jpg" alt="Imagen de Escape de Titanio Alto Flujo" width="130"
                        height="80">
                </div>
            </div>

            <div class="detail-info">

                <h2>ESCAPE DE TITANIO ALTO FLUJO</h2>

                <div class="description">
                    <strong>DESCRIPCIÓN</strong>
                    <p>
                    <p>
                        Mejora la acústica y optimiza la salida de gases.
                        Fabricado en titanio de grado aeroespacial para máxima resistencia y reducción de peso.
                    </p>
                    </p>
                </div>

                <div class="price-quantity">

                    <div>
                        <p class="price">PRECIO: $28.000</p>
                    </div>

                    <div class="quantity-box">
                        <label for="cantidad">CANTIDAD</label>

                        <input class="quantity" type="number" id="cantidad" name="cantidad" min="1" value="1">
                    </div>

                </div>

                <button class="cart-button" type="button">
                    🛒 AGREGAR AL CARRITO
                </button>
            </div>

        </section>

    </main>

</body>

</html>
