<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Configuración para adaptar la página a distintos dispositivos (computadoras, celulares, tablets, etc) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable | Reservas</title>

    <link rel="stylesheet" href="./recursos/css/index.css">


    <link rel="stylesheet" href="./recursos/css/reservas.css">
</head>

<body>

    <!-- Encabezado y menú principal. -->
    <header class="encabezado">

        <a class="logo" href="index.html">
            <!-- Texto alternativo del logo. -->
            <img src="./recursos/imagenes/logo-rs.svg" alt="Retiro Sustentable" width="950" height="200">
        </a>

        <!-- Menú de navegación. -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <!-- Contenido principal. -->
    <main class="contenido">

        <section class="reservas">
            <h1>Consultas y reservas</h1>

            <p>
                Completá el formulario con tus datos para realizar una consulta
                o solicitar una reserva.
            </p>

            <!-- Formulario de consulta y reserva.
            Tenemos el campo para ingresar el "nombre completo" del cliente, tambien tenemos el campo para agregar el "número de "telefono,
            el campo para agregar el "correo electrónico". Ademas,  se encuentra el campo donde el cliente debe aclarar "desde que fecha y hasta que
            fecha" desea reservas las cañabas y el campo de "comentarios" por si el clinete quiere sacarse alguna duda, dejar observaciones
             o agregar información adicional -->
            <form class="formulario-reserva" action="#" method="post">

                <div>
                    <label for="nombre">Nombre y apellido</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" autocomplete="tel" required>
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div>
                    <label for="fecha-desde">Fecha desde</label>
                    <input type="date" id="fecha-desde" name="fecha-desde" required>
                </div>

                <div>
                    <label for="fecha-hasta">Fecha hasta</label>
                    <input type="date" id="fecha-hasta" name="fecha-hasta" required>
                </div>

                <div>
                    <label for="comentario">Comentario</label>
                    <textarea id="comentario" name="comentario" rows="5"
                        placeholder="Escribí aquí tu consulta"></textarea>
                </div>

                <button class="boton" type="submit">
                    Enviar consulta
                </button>

            </form>
        </section>

    </main>

    <!-- Pie de página. -->
    <footer class="pie">
        <p class="texto-pie">2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
